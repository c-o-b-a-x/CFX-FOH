app = 'cfx-foh'
primary_region = 'ams'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'stop'
  force_https = true
  internal_port = 8080
  min_machines_running = 1
  processes = ['app']

[[vm]]
